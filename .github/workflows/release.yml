name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vscode:
    name: Build VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/vscode/package-lock.json

      - name: Install extension dependencies
        working-directory: src/vscode
        run: npm ci

      - name: Verify version metadata
        run: uv run python scripts/sync_version.py --check

      - name: Compile and test extension
        working-directory: src/vscode
        run: npm run smoke

      - name: Prepare bundled server assets
        run: uv run python scripts/prepare_vscode_package.py

      - name: Package VSIX
        working-directory: src/vscode
        run: npm run package:vsix -- --out ../../dist/witcherscript-redkit-tools-${{ github.event.release.tag_name || github.ref_name }}.vsix

      - name: Upload VSIX to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix

      - name: Upload VSIX artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: witcherscript-redkit-tools-vsix
          path: dist/*.vsix
