name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Version metadata check
        run: uv run python scripts/sync_version.py --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/py

      - name: Pytest
        run: uv run pytest --cov=src/py

  dotnet:
    name: .NET
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WitcherScript.RedkitTooling.sln

      - name: Build
        run: dotnet build WitcherScript.RedkitTooling.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WitcherScript.RedkitTooling.sln --configuration Release --no-build --verbosity normal

  vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run check

      - name: Compile
        run: npm run compile
