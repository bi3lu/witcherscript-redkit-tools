[project]
name = "witcherscript-langserver"
version = "0.4.0"
description = "WitcherScript Language Server and REDkit tooling integration"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "click>=8.1.7",
  "lsprotocol>=2023.0.1",
  "pydantic>=2.7.0",
  "pygls>=2.1.1,<3",
  "tomli>=2.0.1; python_version < '3.11'",
  "tomli-w>=1.0.0",
]

[project.scripts]
witcherscript-lsp = "witcherscript_langserver.server:main"
witcherscript = "witcherscript_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "black>=25.0.0",
  "isort>=6.0.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src/py", "tests/py"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "N",
  "RUF",
]
ignore = [
  "N818",
]

[tool.ruff.lint.isort]
known-first-party = [
  "witcherscript_cli",
  "witcherscript_langserver",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src/py", "tests/py"]
known_first_party = [
  "witcherscript_cli",
  "witcherscript_langserver",
]

[tool.pytest.ini_options]
testpaths = ["tests/py"]
pythonpath = ["src/py"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "performance: performance-oriented regression tests for indexing throughput",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src/py"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.hatch.build.targets.wheel]
packages = [
  "src/py/witcherscript_cli",
  "src/py/witcherscript_langserver",
]
